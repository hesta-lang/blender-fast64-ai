name: Blender Project Diagnostics

on:
  workflow_dispatch:
    inputs:
      blend_path:
        description: "Relative path to a .blend file inside inbox/"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Blender and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Inspect Blender project
        env:
          BFAI_BLEND_INPUT: \${{ inputs.blend_path }}
          BFAI_DATA_DIR: \${{ runner.temp }}/bfai-diagnostics-data
          BLENDER_BIN: blender
        run: python scripts/diagnose_blend.py

      - name: Upload pipeline report
        uses: actions/upload-artifact@v4
        with:
          name: blender-pipeline-report
          path: reports/pipeline-report.json
          if-no-files-found: error
          retention-days: 14
